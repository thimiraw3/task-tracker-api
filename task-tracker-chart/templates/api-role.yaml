apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task-tracker-api-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "task-tracker-chart.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]